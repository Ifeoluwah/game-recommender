name: check

# "Does the code work?" Typecheck, the software tests and the demo (every path through the service,
# on the committed OpenAI build). No API key: tests build their own offline data in memory, and the
# demo reads committed artefacts. AI quality is judged separately, in release-gate.yml (spec 05 §9).

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
